<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>dependency_graph.slack.json — dependency graph</title>
<script src="https://unpkg.com/vis-network@9/standalone/umd/vis-network.min.js"></script>
<style>
  html, body { margin: 0; height: 100%; font-family: -apple-system, sans-serif; background: #0f1115; }
  #graph { width: 100%; height: 100%; }
  #stats { position: absolute; top: 12px; left: 12px; background: #1b1f26; color: #e7e7e2;
           padding: 8px 14px; border-radius: 8px; font-size: 13px; z-index: 10; border: 1px solid #2a2f38; }
</style>
</head>
<body>
<div id="stats">14 nodes / 2 edges — dependency_graph.slack.json</div>
<div id="graph"></div>
<script>
  const data = {"nodes":[{"id":"SLACK_LIST_CONVERSATIONS","service":"conversations"},{"id":"SLACK_CREATE_CHANNEL","service":"conversations"},{"id":"SLACK_GET_CONVERSATION_HISTORY","service":"conversations"},{"id":"SLACK_POST_MESSAGE","service":"messages"},{"id":"SLACK_UPDATE_MESSAGE","service":"messages"},{"id":"SLACK_ADD_REACTION","service":"messages"},{"id":"SLACK_LIST_USERS","service":"users"},{"id":"SLACK_LOOKUP_USER_BY_EMAIL","service":"users"},{"id":"SLACK_GET_USER_INFO","service":"users"},{"id":"SLACK_INVITE_TO_CONVERSATION","service":"conversations"},{"id":"SLACK_LIST_CONVERSATION_MEMBERS","service":"conversations"},{"id":"SLACK_PIN_MESSAGE","service":"messages"},{"id":"SLACK_DELETE_MESSAGE","service":"messages"},{"id":"SLACK_ARCHIVE_CONVERSATION","service":"conversations"}],"edges":[{"from":"SLACK_LIST_USERS","to":"SLACK_GET_USER_INFO","label":"user"},{"from":"SLACK_LOOKUP_USER_BY_EMAIL","to":"SLACK_GET_USER_INFO","label":"user"}]};
  const nodes = new vis.DataSet(data.nodes.map(n => ({
    id: n.id, label: n.id.replace(/_/g, " "), group: n.service || "other"
  })));
  const edges = new vis.DataSet(data.edges.map((e, i) => ({
    id: i, from: e.from, to: e.to, label: e.label, arrows: "to", font: { size: 10, color: "#9BA1AC" }
  })));
  new vis.Network(document.getElementById("graph"), { nodes, edges }, {
    layout: { improvedLayout: false },
    physics: {
      solver: "forceAtlas2Based",
      forceAtlas2Based: { gravitationalConstant: -120, springLength: 150 },
      stabilization: { iterations: 200 },
    },
    edges: { smooth: false, color: { color: "#4a5568", opacity: 0.6 } },
    nodes: { shape: "dot", size: 10, font: { color: "#e7e7e2", size: 12 },
             borderWidth: 1, color: { border: "#2a2f38" } },
  });
</script>
</body>
</html>
